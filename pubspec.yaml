name: xchangehub
description: "XChangeHUb - Peer-to-Peer Learning Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  
  # State Management
  provider: ^6.0.0
  
  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.0.0
  flutter_svg: ^2.0.0
  cached_network_image: ^3.0.0
  shimmer: ^3.0.0
  lottie: ^3.0.0
  animations: ^2.0.0
  
  # Image Handling
  image_picker: ^1.0.0
  image_cropper: ^8.0.0
  
  # PDF Generation (for Portfolio)
  pdf: ^3.10.0
  printing: ^5.11.0
  path_provider: ^2.1.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  timeago: ^3.6.0
  url_launcher: ^6.2.0
  share_plus: ^10.0.0
  
  # Video/Chat (for skill exchanges)
  flutter_chat_ui: ^1.6.0
  file_picker: ^8.0.0
  cloud_functions: ^5.6.2  # For Google Meet integration
  
  # Ratings & Reviews
  flutter_rating_bar: ^4.0.0
  
  # Navigation
  go_router: ^14.0.0
  
  # Form Validation
  email_validator: ^3.0.0
  
  # Loading & Progress
  flutter_spinkit: ^5.2.0
  percent_indicator: ^4.2.0
  
  # Video Calling & Chat Enhancements
  add_2_calendar: ^3.0.1
  
  # Enhanced Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/badges/
